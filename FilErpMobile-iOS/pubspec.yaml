name: FilERP
version: 1.0.107+107
description: FilERP.com


publish_to: 'none'


environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_svg: 2.2.4
  mobile_scanner: 7.1.4

  intl: ^0.19.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_native_splash: ^2.3.10

  shared_preferences: ^2.2.2

  dropdown_search: ^5.0.6

  excel: ^4.0.6
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0
  path_provider: ^2.1.2
  flutter_nfc_kit: ^3.3.1
  ndef: ^0.3.5
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.1.4
  open_file: ^3.3.2
  permission_handler: ^11.3.1
  print_bluetooth_thermal: 1.2.1 # CocoaPods destekleyen son sürüm
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0


dependency_overrides:
  printing:
    path: third_party/printing

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/new/
    - assets/icons/finans/
    - assets/icons/corporate/light/
    - assets/icons/corporate/dark/
    - assets/icons/corporate/white/
    - assets/sounds/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_filerp.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
